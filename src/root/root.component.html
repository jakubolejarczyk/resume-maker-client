<div class="border border-surface-200 dark:border-surface-700 rounded-lg overflow-hidden">
    <p-sidebar-layout class="min-h-192! relative!">
        @if (isMobile()) {
            <p-sidebar-backdrop class="absolute!" />
        }
        <p-sidebar id="mobile-nav" [collapsible]="isMobile() ? 'offcanvas' : 'icon'" [overlay]="isMobile()" [open]="!isMobile()" width="14rem">
            <p-sidebar-spacer />
            <p-sidebar-aside>
                <p-sidebar-panel>
                    <p-sidebar-header>
                        <p-sidebar-menu>
                            <p-sidebar-menu-item>
                                <button pSidebarMenuButton class="p-1!" routerLink="/">
                                    <span class="font-semibold text-sm">Resume Maker</span>
                                </button>
                            </p-sidebar-menu-item>
                        </p-sidebar-menu>
                    </p-sidebar-header>
                    <p-sidebar-content>
                        <p-sidebar-group>
                            <p-sidebar-group-label>Menu</p-sidebar-group-label>
                            <p-sidebar-group-content>
                                <p-sidebar-menu>
                                    <p-sidebar-menu-item>
                                        <button pSidebarMenuButton routerLink="/users">
                                            <svg data-p-icon="users"></svg>
                                            <span>Users</span>
                                        </button>
                                    </p-sidebar-menu-item>
                                    <p-sidebar-menu-item>
                                        <button pSidebarMenuButton routerLink="/skills">
                                            <svg data-p-icon="briefcase"></svg>
                                            <span>Skills</span>
                                        </button>
                                    </p-sidebar-menu-item>
                                    <p-sidebar-menu-item>
                                        <button pSidebarMenuButton routerLink="/experiences">
                                            <svg data-p-icon="code"></svg>
                                            <span>Experiences</span>
                                        </button>
                                    </p-sidebar-menu-item>
                                    <p-sidebar-menu-item>
                                        <button pSidebarMenuButton routerLink="/educations">
                                            <svg data-p-icon="graduation-cap"></svg>
                                            <span>Educations</span>
                                        </button>
                                    </p-sidebar-menu-item>
                                </p-sidebar-menu>
                            </p-sidebar-group-content>
                        </p-sidebar-group>
                    </p-sidebar-content>
                </p-sidebar-panel>
            </p-sidebar-aside>
        </p-sidebar>
        <p-sidebar-main>
            <header class="flex h-12 items-center gap-2 border-b border-surface-200 dark:border-surface-700 px-4">
                <button pButton pSidebarTrigger target="mobile-nav" severity="secondary" text size="small">
                    <svg data-p-icon="sidebar"></svg>
                </button>
            </header>
            <div class="flex-1 p-4 flex flex-col gap-4">
                <div class="rounded-lg bg-surface-100 dark:bg-surface-800 h-48"></div>
                <div class="rounded-lg bg-surface-100 dark:bg-surface-800 flex-1"></div>
                <router-outlet></router-outlet>
            </div>
        </p-sidebar-main>
    </p-sidebar-layout>
</div>
