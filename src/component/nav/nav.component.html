@let menuIsOpen = menuIsOpen$ | async;
@let width = width$ | async;

@if (width) {
    <nav class="nav">
        @if (width <= TABLET) {
            <div class="nav__hamburger">
                <app-hamburger-component></app-hamburger-component>
            </div>
        }
        @if (menuIsOpen || width > TABLET + 1) {
            <app-menu-component></app-menu-component>
        }
    </nav>
}
