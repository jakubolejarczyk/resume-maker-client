<p-table [value]="items()" [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template #header>
        <tr>
            @for (column of columns(); track column) {
                <th>{{ column }}</th>
            }
        </tr>
    </ng-template>
    <ng-template #body let-product>
        <tr>
            @for (column of columns(); track column) {
                <td>{{ product[column] }}</td>
            }
        </tr>
    </ng-template>
</p-table>
