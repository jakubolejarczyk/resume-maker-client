<p-table [value]="items()" [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template #header>
        <tr>
            @for (column of columns(); track column.id) {
                @if (column.isVisible) {
                    <th>{{ column.label }}</th>
                }
            }
        </tr>
    </ng-template>
    <ng-template #body let-item>
        <tr>
            @for (column of columns(); track column.id) {
                @if (column.isVisible) {
                    <td>{{ item[column.id] }}</td>
                }
            }
        </tr>
    </ng-template>
</p-table>
