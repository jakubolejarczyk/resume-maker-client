<p-table [value]="items()" [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template #header>
        <tr>
            @for (column of columns(); track column.id) {
                @if (column.isVisible) {
                    <th>
                        <app-input-text-dumb-component></app-input-text-dumb-component>
                    </th>
                }
            }
            <th>
                <app-button-dumb-component label="Create" severity="secondary"></app-button-dumb-component>
            </th>
        </tr>
        <tr>
            @for (column of columns(); track column.id) {
                @if (column.isVisible) {
                    <th>{{ column.label }}</th>
                }
            }
            <th>Actions</th>
        </tr>
    </ng-template>
    <ng-template #body let-item>
        <tr>
            @for (column of columns(); track column.id) {
                @if (column.isVisible) {
                    <td>{{ item[column.id] }}</td>
                }
            }
            <td>
                <app-button-dumb-component label="Delete" severity="danger" (event)="onDelete(item.id)"></app-button-dumb-component>
            </td>
        </tr>
    </ng-template>
</p-table>
