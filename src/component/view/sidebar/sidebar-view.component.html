<p-sidebar-layout>
  @if (isMobile()) {
    <p-sidebar-backdrop class="absolute!" />
  }
  <p-sidebar
    id="mobile-nav"
    [collapsible]="isMobile() ? 'offcanvas' : 'icon'"
    [overlay]="isMobile()"
    [open]="!isMobile()"
    width="14rem"
  >
    <p-sidebar-spacer />
    <p-sidebar-aside>
      <p-sidebar-panel>
        <p-sidebar-header>
          <p-sidebar-menu>
            <p-sidebar-menu-item>
              <button pSidebarMenuButton class="p-1!">
                <div
                  class="flex size-6 shrink-0 items-center justify-center rounded-md bg-linear-to-br from-violet-500 to-indigo-600 text-white text-xs font-bold leading-none"
                >
                  A
                </div>
                <span class="font-semibold text-sm">Acme Inc</span>
              </button>
            </p-sidebar-menu-item>
          </p-sidebar-menu>
        </p-sidebar-header>
        <p-sidebar-content>
          <p-sidebar-group>
            <p-sidebar-group-label>Menu</p-sidebar-group-label>
            <p-sidebar-group-content>
              <p-sidebar-menu>
                <p-sidebar-menu-item>
                  <button pSidebarMenuButton [isActive]="true">
                    <svg data-p-icon="home"></svg>
                    <span>Home</span>
                  </button>
                </p-sidebar-menu-item>
                <p-sidebar-menu-item>
                  <button pSidebarMenuButton>
                    <svg data-p-icon="inbox"></svg>
                    <span>Inbox</span>
                  </button>
                  <p-sidebar-menu-badge>3</p-sidebar-menu-badge>
                </p-sidebar-menu-item>
                <p-sidebar-menu-item>
                  <button pSidebarMenuButton>
                    <svg data-p-icon="search"></svg>
                    <span>Search</span>
                  </button>
                </p-sidebar-menu-item>
                <p-sidebar-menu-item>
                  <button pSidebarMenuButton>
                    <svg data-p-icon="users"></svg>
                    <span>Team</span>
                  </button>
                </p-sidebar-menu-item>
                <p-sidebar-menu-item>
                  <button pSidebarMenuButton>
                    <svg data-p-icon="bell"></svg>
                    <span>Notifications</span>
                  </button>
                </p-sidebar-menu-item>
                <p-sidebar-menu-item>
                  <button pSidebarMenuButton>
                    <svg data-p-icon="cog"></svg>
                    <span>Settings</span>
                  </button>
                </p-sidebar-menu-item>
              </p-sidebar-menu>
            </p-sidebar-group-content>
          </p-sidebar-group>
        </p-sidebar-content>
        <p-sidebar-footer>
          <p-sidebar-menu>
            <p-sidebar-menu-item>
              <button pSidebarMenuButton class="p-1!">
                <p-avatar
                  label="JD"
                  shape="circle"
                  class="size-6 shrink-0 text-xs"
                />
                <span>John Doe</span>
              </button>
            </p-sidebar-menu-item>
          </p-sidebar-menu>
        </p-sidebar-footer>
      </p-sidebar-panel>
    </p-sidebar-aside>
  </p-sidebar>
  <p-sidebar-main>
    <header
      class="flex h-12 items-center gap-2 border-b border-surface-200 dark:border-surface-700 px-4"
    >
      <button
        pButton
        pSidebarTrigger
        target="mobile-nav"
        severity="secondary"
        text
        size="small"
      >
        <svg data-p-icon="sidebar"></svg>
      </button>
      <span class="text-sm font-medium">Dashboard</span>
      <span
        class="ml-auto text-xs text-muted-color rounded-md bg-surface-100 dark:bg-surface-800 px-2 py-1"
        >{{ isMobile() ? "Mobile" : "Desktop" }}</span
      >
    </header>
    <ng-content></ng-content>
  </p-sidebar-main>
</p-sidebar-layout>
