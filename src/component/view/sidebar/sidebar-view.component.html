<p-sidebar-layout>
  @if (isMobile()) {
    <p-sidebar-backdrop class="absolute!" />
  }
  <p-sidebar
    id="mobile-nav"
    [collapsible]="isMobile() ? 'offcanvas' : 'icon'"
    [overlay]="isMobile()"
    [open]="!isMobile()"
    width="14rem"
  >
    <p-sidebar-spacer />
    <p-sidebar-aside>
      <p-sidebar-panel>
        <p-sidebar-header>
          <p-sidebar-menu>
            <p-sidebar-menu-item>
              <button pSidebarMenuButton class="p-1!">
                <span class="font-semibold text-sm">Resume Maker</span>
              </button>
            </p-sidebar-menu-item>
          </p-sidebar-menu>
        </p-sidebar-header>
        <p-sidebar-content>
          <p-sidebar-group>
            <p-sidebar-group-label>Menu</p-sidebar-group-label>
            <p-sidebar-group-content>
              <p-sidebar-menu>
                <p-sidebar-menu-item>
                  <button pSidebarMenuButton routerLink="/user">
                    <svg data-p-icon="user"></svg>
                    <span>User</span>
                  </button>
                </p-sidebar-menu-item>
                <p-sidebar-menu-item>
                  <button
                    pSidebarMenuButton
                    routerLink="/resume"
                    [disabled]="true"
                  >
                    <svg data-p-icon="inbox"></svg>
                    <span>Resume</span>
                  </button>
                </p-sidebar-menu-item>
                <p-sidebar-menu-item>
                  <button
                    pSidebarMenuButton
                    routerLink="/skill"
                    [disabled]="true"
                  >
                    <svg data-p-icon="code"></svg>
                    <span>Skill</span>
                  </button>
                </p-sidebar-menu-item>
                <p-sidebar-menu-item>
                  <button
                    pSidebarMenuButton
                    routerLink="/experience"
                    [disabled]="true"
                  >
                    <svg data-p-icon="building"></svg>
                    <span>Experience</span>
                  </button>
                </p-sidebar-menu-item>
                <p-sidebar-menu-item>
                  <button
                    pSidebarMenuButton
                    routerLink="/education"
                    [disabled]="true"
                  >
                    <svg data-p-icon="graduation-cap"></svg>
                    <span>Education</span>
                  </button>
                </p-sidebar-menu-item>
              </p-sidebar-menu>
            </p-sidebar-group-content>
          </p-sidebar-group>
        </p-sidebar-content>
      </p-sidebar-panel>
    </p-sidebar-aside>
  </p-sidebar>
  <p-sidebar-main>
    <header
      class="flex h-12 items-center gap-2 border-b border-surface-200 dark:border-surface-700 px-4"
    >
      <button
        pButton
        pSidebarTrigger
        target="mobile-nav"
        severity="secondary"
        text
        size="small"
      >
        <svg data-p-icon="sidebar"></svg>
      </button>
      <span class="text-sm font-medium">Dashboard</span>
      <span
        class="ml-auto text-xs text-muted-color rounded-md bg-surface-100 dark:bg-surface-800 px-2 py-1"
        >{{ isMobile() ? "Mobile" : "Desktop" }}</span
      >
    </header>
    <ng-content></ng-content>
  </p-sidebar-main>
</p-sidebar-layout>
