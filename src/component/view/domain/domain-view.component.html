@let parentId = parentId$ | async;
<app-dialog-overlay-component
  [dialogOverlayTrigger]="dialogOverlayTrigger()"
  (dataEvent)="onDialogOverlayEvent($event)"
></app-dialog-overlay-component>
<app-table-data-component
  [columns$]="columns$"
  [items$]="items$"
  (onCreateEvent)="onCreateEvent(parentId)"
  (onSelectEvent)="onSelectEvent($event)"
  (onDeselectEvent)="onDeselectEvent($event)"
  (onUpdateEvent)="onUpdateEvent($event)"
  (onDeleteEvent)="onDeleteEvent($event)"
  (onMoveUpEvent)="onMoveUpEvent($event)"
  (onMoveDownEvent)="onMoveDownEvent($event)"
></app-table-data-component>
