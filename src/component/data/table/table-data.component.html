@let columns = columns$ | async;
@let items = items$ | async;

@if (items) {
  <p-table [value]="items" [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template #header>
      <tr>
        @for (column of columns; track column.id) {
          @if (column.isVisible) {
            <th>{{ column.label }}</th>
          }
        }
        <th>Actions</th>
      </tr>
    </ng-template>
    <ng-template #body let-item>
      <tr>
        @for (column of columns; track column.id) {
          @if (column.isVisible) {
            <td>{{ item.data[column.id] }}</td>
          }
        }
        <td>
          <button pButton (click)="onMoveUp(item.metadata.id)">Move up</button>
          <button pButton (click)="onMoveDown(item.metadata.id)">
            Move down
          </button>
          <button pButton (click)="onDelete(item.metadata.id)">Delete</button>
        </td>
      </tr>
    </ng-template>
  </p-table>
}
