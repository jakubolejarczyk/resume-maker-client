<p-table [value]="items()" showGridlines [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template #header>
        <tr>
            @for (column of columns(); track column.id) {
                @if (column.isVisible) {
                    <th>{{ column.label }}</th>
                }
            }
            <th>Actions</th>
        </tr>
    </ng-template>
    <ng-template #body let-item>
        <tr>
            @for (column of columns(); track column.id) {
                @if (column.isVisible) {
                    <td>{{ item[column.id] }}</td>
                }
            }
            <td>
                <app-button-form-component
                    label="Update"
                    size="small"
                    severity="secondary"
                    (event)="onUpdate(item)"
                ></app-button-form-component>
                <app-button-form-component
                    label="Delete"
                    size="small"
                    severity="secondary"
                    (event)="onDelete(item)"
                ></app-button-form-component>
            </td>
        </tr>
    </ng-template>
</p-table>
